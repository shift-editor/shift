# Commits run the fast checks: formatting, lint, clippy, and types, a few
# seconds. Tests, dead code, and the SDK API report run once per push. Install both with
# `pre-commit install` (default_install_hook_types below). CI runs everything.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # Standard file hygiene
  # Generated files (bridge DTO typegen, NAPI .d.ts, parity fixtures) are excluded
  # because their format is owned by the generator. Re-formatting them here
  # creates churn with the hooks that regenerate them.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(packages/types/src/bridge/generated\.ts|packages/types/__fixtures__/|crates/shift-bridge/index\.(d\.ts|js))'
      - id: end-of-file-fixer
        exclude: '^(packages/types/src/bridge/generated\.ts|packages/types/__fixtures__/|crates/shift-bridge/index\.(d\.ts|js))'
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Slop detection
  - repo: local
    hooks:
      - id: no-empty-files
        name: no empty files
        entry: 'bash -c ''for f in "$@"; do if [ -f "$f" ] && [ ! -s "$f" ]; then echo "Empty file: $f"; exit 1; fi; done'''
        language: system
        types_or: [javascript, jsx, ts, tsx, rust, css, json]

      - id: no-console-debug-output
        name: no console debug output in production code
        entry: "bash -c 'for f in \"$@\"; do case \"$f\" in *.test.*|*/testing/*|*/e2e/*|scripts/*|*/scripts/*) continue;; esac; if grep -En \"^[[:space:]]*console\\.(log|debug|table|group|groupCollapsed|groupEnd)\\b\" \"$f\" >/dev/null 2>&1; then echo \"$f has console debug output:\"; grep -En \"^[[:space:]]*console\\.(log|debug|table|group|groupCollapsed|groupEnd)\\b\" \"$f\"; exit 1; fi; done'"
        language: system
        types_or: [javascript, jsx, ts, tsx]

  # Rust hooks
  - repo: local
    hooks:
      - id: napi-dead-methods
        name: napi dead methods
        entry: ./scripts/check-napi-dead-methods.sh
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # nextest runs the test binaries in parallel (about 20 s against 49 s
      # for `cargo test`); it does not run doc tests, so they follow.
      - id: cargo-test
        name: cargo test
        entry: bash -c 'cargo nextest run --workspace --exclude shift-bridge && cargo test --doc --workspace --exclude shift-bridge'
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

  # TypeScript/JavaScript hooks
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: pnpm format:files --no-error-on-unmatched-pattern
        language: system
        types_or: [javascript, jsx, ts, tsx, css, json, markdown]
        exclude: '^(packages/types/src/bridge/generated\.ts|packages/types/__fixtures__/|crates/shift-bridge/index\.(d\.ts|js))'

      - id: oxlint
        name: oxlint
        entry: pnpm lint:check
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

      - id: tsgo-typecheck
        name: tsgo typecheck
        entry: pnpm typecheck
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

      # Regenerates packages/sdk/api/*.api.md; a changed report fails the push so it is
      # reviewed and committed like any other public API change. It bundles the
      # whole SDK (about 25 s), so it runs per push rather than per commit.
      - id: sdk-api-report
        name: sdk api report
        entry: pnpm --filter @shift-editor/sdk api:update
        language: system
        files: ^packages/(editor|geo|glyph-state|rules|sdk|types|ui|validation)/
        pass_filenames: false
        stages: [pre-push]

      - id: deadcode
        name: deadcode (strict)
        entry: pnpm deadcode:strict
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
        stages: [pre-push]

      - id: vitest
        name: vitest
        entry: pnpm test
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
        stages: [pre-push]
