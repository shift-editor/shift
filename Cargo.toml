[workspace]
resolver = "2"
members = ["crates/*"]


# Lints for every crate (each opts in with `[lints] workspace = true`). CI runs
# clippy with `-D warnings`, so "warn" blocks merges. Add a lint here once the
# workspace is clean for it; the planned ones are in the rust skill.
[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# `unwrap_used` and `print_stdout` are set in each library's lib.rs, so they
# cover library code but not integration tests or examples.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
# Say what the code means.
fn_params_excessive_bools = "warn"
manual_let_else = "warn"
manual_assert = "warn"
uninlined_format_args = "warn"
implicit_clone = "warn"
unnested_or_patterns = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
# Borrow what isn't consumed: ids and collections by reference.
needless_pass_by_value = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
too_many_lines = "warn"
large_types_passed_by_value = "warn"
# Iteration order must not depend on hashing: engine output is compared
# bit for bit across runs and between native and WebAssembly.
iter_over_hash_type = "warn"
# Iterate once; don't collect only to iterate again.
needless_collect = "warn"
# A method that ignores `self` belongs on another type or nowhere.
unused_self = "warn"
match_same_arms = "warn"
ref_option = "warn"
option_option = "warn"
cloned_instead_of_copied = "warn"
or_fun_call = "warn"
unnecessary_wraps = "warn"
tuple_array_conversions = "warn"
bool_to_int_with_if = "warn"
items_after_statements = "warn"
struct_excessive_bools = "warn"
# Name the type once: `Self` inside its own impl.
use_self = "warn"
map_unwrap_or = "warn"
# `Arc::clone(&x)` shows a reference-count bump, not a deep copy.
clone_on_ref_ptr = "warn"
# The rustdoc skill requires `# Errors` on every public fallible function.
missing_errors_doc = "warn"

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
shift-wire = { path = "crates/shift-wire" }
shift-backends = { path = "crates/shift-backends" }
shift-bridge = { path = "crates/shift-bridge" }
shift-config = { path = "crates/shift-config" }
shift-shape = { path = "crates/shift-shape" }
shift-font = { path = "crates/shift-font" }
shift-proof = { path = "crates/shift-proof" }
shift-slug = { path = "crates/shift-slug" }
shift-specimen = { path = "crates/shift-specimen" }
shift-store = { path = "crates/shift-store" }
shift-workspace = { path = "crates/shift-workspace" }

[profile.e2e]
inherits = "release"
opt-level = 1
codegen-units = 256
