[package]
name = "engine-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native"
path = "src/main.rs"

[dependencies]
shift-font = { path = "../../crates/shift-font" }
serde = "1"
serde_json = "1"
libm = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.121"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[profile.release]
debug = false

[workspace]
