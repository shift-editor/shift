[package]
name = "engine-wasm-probe"
version = "0.0.0"
edition = "2021"
publish = false

# Spike 6: startup cost of an engine module carrying all of shift-font's
# editing code, opened from a native MessagePack snapshot.
[lib]
crate-type = ["cdylib"]

[dependencies]
shift-font = { path = "../../crates/shift-font" }
rmp-serde = "1"
wasm-bindgen = "=0.2.121"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
