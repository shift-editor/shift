[package]
name = "engine-derisk"
version = "0.0.0"
edition = "2021"
publish = false

# De-risk spikes for moving font-level edits into the renderer engine.
# Each spike is its own test file under tests/; shared helpers live in src/.
[dependencies]
shift-font = { path = "../../crates/shift-font", features = ["test-support"] }
shift-workspace = { path = "../../crates/shift-workspace" }
shift-store = { path = "../../crates/shift-store" }
shift-backends = { path = "../../crates/shift-backends" }
shift-shape = { path = "../../crates/shift-shape" }
shift-wire = { path = "../../crates/shift-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
postcard = { version = "1", features = ["use-std"] }
tempfile = "3"

[workspace]
