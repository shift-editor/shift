name: Pull Request Title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  merge_group:
    types:
      - checks_requested

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Confirm queued titles were validated
        if: github.event_name == 'merge_group'
        run: echo "Pull request titles passed before entering the merge queue."

      - name: Check current title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_TITLE="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)"
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|perf|refactor|docs|test|build|ci|style|chore)(\([^\)]+\))?(!)?:\ .+ ]]; then
            echo "Pull request title must use Conventional Commits syntax." >&2
            echo "Received: $PR_TITLE" >&2
            exit 1
          fi
