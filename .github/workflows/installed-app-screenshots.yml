name: Installed App Screenshots

on:
  pull_request:
    paths:
      - .github/workflows/installed-app-screenshots.yml
      - apps/desktop/electron-builder.config.ts
      - scripts/capture-installed-app.mjs
      - scripts/run-with-virtual-desktop.mjs
  pull_request_target:
    types:
      - labeled
  workflow_dispatch:

permissions: {}

concurrency:
  group: installed-app-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture ${{ matrix.name }}
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.label.name == 'ci: installed app screenshots' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-26
            platform: darwin
            architecture: arm64
            directory: macos-arm64
            builder-args: --mac dmg --arm64
          - name: Windows x64
            runner: windows-latest
            platform: win32
            architecture: x64
            directory: windows-x64
            builder-args: --win nsis --x64
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            architecture: x64
            directory: linux-x64
            builder-args: --linux deb --x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          submodules: true

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Linux packaging and display tools
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          adwaita-icon-theme dbus-x11 fakeroot fluxbox gsettings-desktop-schemas rpm xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache native bridge
        id: native-cache
        uses: actions/cache@v6
        with:
          path: crates/shift-bridge/*.node
          key: installed-native-v1-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/*/Cargo.toml', 'crates/*/build.rs', 'crates/*/src/**', 'crates/shift-bridge/package.json', 'crates/shift-bridge/*.d.ts', 'pnpm-lock.yaml', 'turbo.json') }}

      - name: Build native bridge
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: pnpm build:native

      - name: Build desktop application
        env:
          SHIFT_DISTRIBUTION: release
        run: pnpm --filter @shift/desktop build

      - name: Build installer
        env:
          SHIFT_BUILD_ARCH: ${{ matrix.architecture }}
          SHIFT_DISTRIBUTION: release
          SHIFT_INSTALLED_APP_SCREENSHOTS: "1"
        run: >-
          pnpm --filter @shift/desktop exec electron-builder
          --config electron-builder.config.ts
          ${{ matrix.builder-args }}
          --publish never

      - name: Install macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find apps/desktop/out/darwin-${{ matrix.architecture }} -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_point="$RUNNER_TEMP/shift-dmg"
          installed_app="$RUNNER_TEMP/Applications/Shift.app"
          mkdir -p "$mount_point" "$(dirname "$installed_app")"
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -readonly
          trap 'hdiutil detach "$mount_point" -force >/dev/null 2>&1 || true' EXIT
          ditto "$mount_point/Shift.app" "$installed_app"
          hdiutil detach "$mount_point"
          trap - EXIT

          launch_services=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$launch_services" -f "$installed_app"
          executable="$installed_app/Contents/MacOS/Shift"
          test -x "$executable"
          echo "SHIFT_INSTALLED_APP_PATH=$executable" >> "$GITHUB_ENV"

      - name: Install Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/out/win32-x64/*Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }

          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru
          Wait-Process -Id $process.Id -Timeout 300
          if ($process.ExitCode -ne 0) { throw "Windows installer exited with $($process.ExitCode)" }

          Start-Sleep -Seconds 2
          Get-Process shift -ErrorAction SilentlyContinue | Stop-Process -Force

          $installed = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter "shift.exe" -Recurse |
            Select-Object -First 1
          if (-not $installed) { throw "Installed Shift executable was not found" }

          Add-Content -Path $env:GITHUB_ENV -Value "SHIFT_INSTALLED_APP_PATH=$($installed.FullName)"

      - name: Install Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="$(find apps/desktop/out/linux-x64 -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          sudo apt-get install --yes "$PWD/$package"
          executable="$(readlink -f /usr/bin/shift)"
          test -x "$executable"
          echo "SHIFT_INSTALLED_APP_PATH=$executable" >> "$GITHUB_ENV"

      - name: Capture installed macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          node scripts/capture-installed-app.mjs
          "$SHIFT_INSTALLED_APP_PATH"
          "installed-app-screenshots/${{ matrix.directory }}"

      - name: Capture installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          node scripts/capture-installed-app.mjs
          "$env:SHIFT_INSTALLED_APP_PATH"
          "installed-app-screenshots/${{ matrix.directory }}"

      - name: Capture installed Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- node scripts/run-with-virtual-desktop.mjs -- \
            node scripts/capture-installed-app.mjs \
            "$SHIFT_INSTALLED_APP_PATH" \
            "installed-app-screenshots/$SHIFT_SCREENSHOT_DIRECTORY"
        env:
          SHIFT_SCREENSHOT_DIRECTORY: ${{ matrix.directory }}

      - name: Upload installed app screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-app-screenshots-${{ matrix.platform }}-${{ matrix.architecture }}
          path: installed-app-screenshots/
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Report installed app screenshots
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name == 'pull_request' ||
        (github.event_name == 'pull_request_target' &&
          github.event.label.name == 'ci: installed app screenshots'))
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download installed app screenshots
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: installed-app-screenshots-*
          path: installed-app-screenshots
          merge-multiple: true

      - id: upload
        name: Publish installed app screenshots
        if: always()
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCREENSHOT_ACCESS_KEY_ID }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCREENSHOT_SECRET_ACCESS_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BASE_URL: ${{ vars.R2_SCREENSHOT_BASE_URL }}
          R2_BUCKET: ${{ vars.R2_SCREENSHOT_BUCKET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          screenshot_names=(
            launcher.png
            launcher-desktop.png
            document.png
            document-desktop.png
            file-association.png
            file-association-desktop.png
            application-menu.png
            native-dialog.png
          )
          screenshots=()
          for platform in macos-arm64 windows-x64 linux-x64; do
            for name in "${screenshot_names[@]}"; do
              screenshot="installed-app-screenshots/${platform}/${name}"
              [[ -f "$screenshot" ]] && screenshots+=("$screenshot")
            done
          done
          if [[ ${#screenshots[@]} -eq 0 ]]; then
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          : "${AWS_ACCESS_KEY_ID:?R2_SCREENSHOT_ACCESS_KEY_ID is required}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SCREENSHOT_SECRET_ACCESS_KEY is required}"
          : "${R2_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          : "${R2_BUCKET:?R2_SCREENSHOT_BUCKET is required}"
          : "${R2_BASE_URL:?R2_SCREENSHOT_BASE_URL is required}"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "Pull request and run IDs must be positive integers" >&2
            exit 1
          }
          [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || {
            echo "CLOUDFLARE_ACCOUNT_ID is invalid" >&2
            exit 1
          }
          [[ "$R2_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || {
            echo "R2_SCREENSHOT_BUCKET is invalid" >&2
            exit 1
          }
          r2_origin="${R2_BASE_URL%/}"
          [[ "$r2_origin" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || {
            echo "R2_SCREENSHOT_BASE_URL must be an HTTPS origin" >&2
            exit 1
          }

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="installed-app-screenshots/pr-${PR_NUMBER}/run-${RUN_ID}"
          destination="s3://${R2_BUCKET}/${prefix}"
          base_url="${r2_origin}/${prefix}"
          for screenshot in "${screenshots[@]}"; do
            relative="${screenshot#installed-app-screenshots/}"
            aws s3 cp "$screenshot" "${destination}/${relative}" \
              --endpoint-url "$endpoint" \
              --cache-control 'public, max-age=300' \
              --content-type image/png \
              --no-progress \
              --only-show-errors

            content_type="$(curl \
              --fail \
              --head \
              --retry 5 \
              --retry-all-errors \
              --show-error \
              --silent \
              --output /dev/null \
              --write-out '%{content_type}' \
              "${base_url}/${relative}")"
            [[ "$content_type" == "image/png" ]] || {
              echo "Public screenshot has unexpected content type: ${content_type:-missing}" >&2
              exit 1
            }
          done

          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Update pull request comment
        if: always()
        uses: actions/github-script@v8
        env:
          SCREENSHOT_BASE_URL: ${{ steps.upload.outputs.base_url }}
          SCREENSHOTS_UPLOADED: ${{ steps.upload.outputs.uploaded }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const marker = "<!-- installed-app-screenshots -->";
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const serverUrl = process.env.GITHUB_SERVER_URL;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runId,
              filter: "latest",
              per_page: 100,
            });
            const platforms = [
              {
                name: "macOS arm64",
                jobName: "Capture macOS arm64",
                directory: "macos-arm64",
              },
              {
                name: "Windows x64",
                jobName: "Capture Windows x64",
                directory: "windows-x64",
              },
              {
                name: "Linux x64",
                jobName: "Capture Linux x64",
                directory: "linux-x64",
              },
            ];
            const screenshots = [
              ["Launcher window", "launcher.png"],
              ["Launcher desktop", "launcher-desktop.png"],
              ["Document window", "document.png"],
              ["Document desktop", "document-desktop.png"],
              ["File association window", "file-association.png"],
              ["File association desktop", "file-association-desktop.png"],
              ["Application menu", "application-menu.png"],
              ["Native dialog", "native-dialog.png"],
            ];
            const statusFor = ({ jobName }) => {
              const job = jobs.find((candidate) => candidate.name === jobName);
              const result = job?.conclusion ?? job?.status ?? "not found";
              return result === "success" ? `✅ ${result}` : `❌ ${result}`;
            };
            const imageFor = (platform, label, fileName) => {
              const relativePath = `${platform.directory}/${fileName}`;
              const localPath = path.join("installed-app-screenshots", relativePath);
              if (process.env.SCREENSHOTS_UPLOADED !== "true" || !fs.existsSync(localPath)) {
                return "Not available";
              }

              const url = `${process.env.SCREENSHOT_BASE_URL}/${relativePath}`;
              const alt = `${platform.name} ${label}`;
              return `<a href="${url}"><img src="${url}" alt="${alt}" width="360"></a>`;
            };
            const statusRows = platforms.map(
              (platform) => `| ${platform.name} | ${statusFor(platform)} |`,
            );
            const screenshotRows = screenshots.map(([label, fileName]) => {
              const images = platforms.map((platform) => imageFor(platform, label, fileName));
              return `| ${label} | ${images.join(" | ")} |`;
            });
            const body = [
              marker,
              "## Installed app screenshots",
              "",
              "| Platform | Result |",
              "| --- | --- |",
              ...statusRows,
              "",
              "<details>",
              "<summary>Screenshots</summary>",
              "",
              `| Scenario | ${platforms.map((platform) => platform.name).join(" | ")} |`,
              `| --- | ${platforms.map(() => "---").join(" | ")} |`,
              ...screenshotRows,
              "",
              "</details>",
              "",
              `[View workflow run](${serverUrl}/${owner}/${repo}/actions/runs/${runId})`,
              "",
              "Screenshots are review artifacts, not pixel-gated baselines. Public PNGs expire after 14 days.",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
            }
