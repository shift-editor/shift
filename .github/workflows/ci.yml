name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Gate: detect which parts of the monorepo changed
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      release: ${{ steps.filter.outputs.release }}
      skills: ${{ steps.filter.outputs.skills }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            typescript:
              - 'apps/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
            release:
              - '.github/workflows/**'
              - '.release-please-manifest.json'
              - 'release-please-config.json'
              - 'CHANGELOG.md'
              - 'docs/releases.md'
              - 'package.json'
              - 'apps/desktop/package.json'
              - 'apps/desktop/build.ts'
              - 'apps/desktop/electron-builder.config.ts'
              - 'apps/desktop/forge.config.ts'
              - 'apps/desktop/vite.main.config.ts'
              - 'apps/desktop/vite.preload.config.ts'
              - 'scripts/find-retired-nightly-objects.mjs'
              - 'scripts/find-retired-nightly-objects.test.mjs'
              - 'scripts/prepare-linux-repositories.mjs'
              - 'scripts/prepare-linux-repositories.test.mjs'
              - 'scripts/prepare-nightly-release.mjs'
              - 'scripts/prepare-nightly-release.test.mjs'
              - 'scripts/prepare-update-feed.mjs'
              - 'scripts/prepare-update-feed.test.mjs'
              - 'scripts/product-version.mjs'
              - 'scripts/product-version.test.mjs'
              - 'scripts/smoke-packaged.mjs'
            skills:
              - '.agents/skills/**'
            docs:
              - '**/docs/DOCS.md'
              - 'docs/architecture/**'
              - 'scripts/context-drift-check.py'
              - 'scripts/check-docs-fences.mjs'
              - 'scripts/check-invariants.py'
              - '.claude/skills/**'
              - '.codex/skills/**'
              - 'scripts/sync-agent-skills.mjs'

  agent-skills:
    name: Agent Skills
    needs: detect-changes
    if: needs.detect-changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check synchronized skills
        run: node scripts/sync-agent-skills.mjs --check

  # ---------------------------------------------------------------------------
  # Documentation drift: DOCS.md structure/link/symbol/command integrity,
  # ts-fence compilation, and architecture invariants. Errors gate; freshness
  # warnings are advisory (--ci).
  # ---------------------------------------------------------------------------
  docs-drift:
    name: Docs Drift
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true' || needs.detect-changes.outputs.typescript == 'true' || needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache node_modules
        id: modules-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            crates/*/node_modules
          key: node-modules-v3-node24-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Context drift check
        run: python3 scripts/context-drift-check.py --ci

      - name: Docs fence typecheck
        run: node scripts/check-docs-fences.mjs

      - name: Architecture invariants
        run: python3 scripts/check-invariants.py

  # ---------------------------------------------------------------------------
  # TypeScript jobs (no submodules needed)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache node_modules
        id: modules-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            crates/*/node_modules
          key: node-modules-v3-node24-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint (oxlint)
        run: pnpm test:lint
      - name: Format check (oxfmt)
        run: pnpm format:check

  typecheck:
    name: Typecheck
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache node_modules
        id: modules-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            crates/*/node_modules
          key: node-modules-v3-node24-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Typecheck Turbo results
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: typecheck-turbo-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            typecheck-turbo-v1-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

  unit-test:
    name: Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache node_modules
        id: modules-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            crates/*/node_modules
          key: node-modules-v3-node24-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache native Turbo build
        id: native-turbo-cache
        uses: actions/cache@v6
        with:
          path: |
            .turbo/cache
            crates/shift-bridge/*.node
          key: native-turbo-v1-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/*/Cargo.toml', 'crates/*/build.rs', 'crates/*/src/**', 'crates/shift-bridge/package.json', 'crates/shift-bridge/*.d.ts', 'pnpm-lock.yaml', 'turbo.json') }}

      - uses: Swatinem/rust-cache@v2
        if: steps.native-turbo-cache.outputs.cache-hit != 'true'
        with:
          shared-key: shift-rust

      - name: Run unit tests
        run: pnpm test:unit

  deadcode:
    name: Dead Code
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache node_modules
        id: modules-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            crates/*/node_modules
          key: node-modules-v3-node24-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Dead code check (knip)
        run: pnpm deadcode:strict

  release-config:
    name: Release Configuration
    needs: detect-changes
    if: needs.detect-changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install release dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Test release scripts
        run: pnpm test:release

      - name: Check product version
        run: pnpm version:check

      - name: Validate Release Please configuration
        run: |
          jq empty release-please-config.json .release-please-manifest.json
          test "$(jq -r '.["."]' .release-please-manifest.json)" = "$(node scripts/product-version.mjs check)"

  # ---------------------------------------------------------------------------
  # Rust jobs (toolchain pinned via rust-toolchain.toml)
  # ---------------------------------------------------------------------------
  rust-fmt:
    name: Rust Format
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all --check

  rust-check:
    name: Rust Clippy & Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - name: Install toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: shift-rust

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --exclude shift-bridge

  integration:
    name: Integration Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: shift-rust

      - name: Cache node_modules
        id: modules-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            crates/*/node_modules
          key: node-modules-v3-node24-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build native module
        run: pnpm build:native

      - name: Run shift-bridge tests
        run: pnpm test:native

  # ---------------------------------------------------------------------------
  # Required end-to-end correctness
  # ---------------------------------------------------------------------------
  e2e-build:
    name: E2E Build ${{ matrix.name }}
    needs: detect-changes
    if: >-
      (github.event_name == 'merge_group' &&
        (needs.detect-changes.outputs.typescript == 'true' ||
          needs.detect-changes.outputs.rust == 'true')) ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
          - name: Linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install toolchain
        run: rustup show

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            crates/*/node_modules
          key: node-modules-v3-node24-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache native module binary
        id: native-cache
        uses: actions/cache@v6
        with:
          path: crates/shift-bridge/*.node
          key: native-module-${{ runner.os }}-${{ hashFiles('crates/**', 'Cargo.lock') }}

      - uses: Swatinem/rust-cache@v2
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          shared-key: shift-rust-${{ runner.os }}

      - name: Build native module
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: pnpm build:native

      - name: Generate glyph info
        run: pnpm generate:glyph-info

      - name: Build E2E app
        run: pnpm --filter @shift/desktop build:e2e

      - name: Upload E2E app
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app-${{ github.run_id }}-${{ runner.os }}
          path: |
            apps/desktop/.vite/
            crates/shift-bridge/*.node
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E ${{ matrix.name }} ${{ matrix.shard }}/${{ matrix.shard-total }}
    needs: e2e-build
    strategy:
      fail-fast: false
      matrix:
        target: [visual, platform-windows, platform-linux]
        shard: [1, 2, 3]
        include:
          - shard-total: 3
          - target: visual
            name: Visual
            project: visual
            runner: macos-latest
          - target: platform-windows
            name: Platform Windows
            project: platform
            runner: windows-latest
          - target: platform-linux
            name: Platform Linux
            project: platform
            runner: ubuntu-latest
          - target: gpu
            name: GPU
            project: gpu
            runner: macos-latest
            shard: 1
            shard-total: 1
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux display environment
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fluxbox xvfb

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            crates/*/node_modules
          key: node-modules-v3-node24-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download E2E app
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-${{ github.run_id }}-${{ runner.os }}
          path: .

      - name: Run E2E tests
        if: runner.os != 'Linux'
        run: >-
          pnpm --dir apps/desktop exec playwright test
          --project=${{ matrix.project }}
          --fully-parallel
          --shard=${{ matrix.shard }}/${{ matrix.shard-total }}

      - name: Run E2E tests with virtual desktop
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' sh -c
          'fluxbox >/tmp/shift-fluxbox.log 2>&1 & sleep 1;
          exec pnpm --dir apps/desktop exec playwright test
          --project=${{ matrix.project }} --fully-parallel --shard=${{ matrix.shard }}/${{ matrix.shard-total }}'

      - name: Upload platform evidence
        if: always() && matrix.project == 'platform'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.target }}-${{ matrix.shard }}-of-${{ matrix.shard-total }}-results
          path: apps/desktop/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failures
        if: failure() && matrix.project != 'platform'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.target }}-${{ matrix.shard }}-of-${{ matrix.shard-total }}-results
          path: apps/desktop/e2e/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Gate: all required checks must pass
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI Passed
    if: always()
    needs:
      - detect-changes
      - agent-skills
      - lint
      - typecheck
      - unit-test
      - deadcode
      - release-config
      - rust-fmt
      - rust-check
      - integration
      - e2e-build
      - e2e
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check required jobs
        run: |
          echo "Results: ${{ toJSON(needs.*.result) }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required checks passed."
