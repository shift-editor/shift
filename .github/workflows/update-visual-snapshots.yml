name: Update Visual Snapshots

on:
  pull_request_target:
    types:
      - labeled

permissions: {}

# Every label event starts this workflow, so key the group on the label too: adding an
# unrelated label must not cancel an in-progress snapshot run for the same pull request.
concurrency:
  group: update-visual-snapshots-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Snapshots
    if: >-
      github.event.label.name == 'ci: update visual snapshots' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install toolchain
        run: rustup show

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            crates/*/node_modules
          key: node-modules-v3-node24-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Same key and build as CI's E2E build, so the binary CI already built for this
      # commit is restored instead of compiled again.
      - name: Cache native module binary
        id: native-cache
        uses: actions/cache@v6
        with:
          path: crates/shift-bridge/*.node
          key: native-module-e2e-v1-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/**', 'Cargo.lock', 'rust-toolchain.toml') }}

      - uses: Swatinem/rust-cache@v2
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          shared-key: shift-rust-${{ runner.os }}

      - name: Build native module
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: pnpm build:native:e2e

      # Parallel workers start several apps at once. On a fresh runner the first concurrent
      # launches can map a partly loaded Electron framework and abort in dyld, so load it once
      # before the tests start.
      - name: Load Electron
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: pnpm --dir apps/desktop exec electron -e "0"

      # Only tests that own a golden run; fixtures/snapshots.ts fails any golden captured
      # in an untagged test, so none is skipped here. CI on the pushed commit compares
      # the new baselines.
      - name: Update visual snapshots
        env:
          E2E_WORKERS: 2
        run: pnpm test:e2e:visual --grep @golden --update-snapshots=all

      - name: Create snapshot patch
        id: patch
        env:
          PATCH_PATH: ${{ runner.temp }}/visual-snapshots.patch
        run: |
          # New goldens are untracked; mark them intent-to-add so git diff includes them.
          git add --intent-to-add -- apps/desktop/e2e/__screenshots__

          unexpected="$(git diff --name-only | grep -v '^apps/desktop/e2e/__screenshots__/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Snapshot update modified unexpected files:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --quiet -- apps/desktop/e2e/__screenshots__; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --binary -- apps/desktop/e2e/__screenshots__ > "$PATCH_PATH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload snapshot patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots-${{ github.run_id }}
          path: ${{ runner.temp }}/visual-snapshots.patch
          retention-days: 1

  commit:
    name: Commit Snapshots
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@v7
        with:
          name: visual-snapshots-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Apply snapshot patch
        env:
          PATCH_PATH: ${{ runner.temp }}/visual-snapshots.patch
        run: |
          git apply --binary --index "$PATCH_PATH"

          unexpected="$(git diff --cached --name-only | grep -v '^apps/desktop/e2e/__screenshots__/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Snapshot patch contains unexpected files:"
            echo "$unexpected"
            exit 1
          fi

          test -n "$(git diff --cached --name-only)"

      - name: Commit and push snapshots
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(e2e): update visual snapshots"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The bot's push starts the pull request workflows (CI, PR Title), but they wait for
      # approval. Approve them so the required checks report on the snapshot commit. If none
      # appear, dispatch CI instead.
      - name: Start checks on the snapshot commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          runs=""
          for attempt in $(seq 1 12); do
            sleep 10
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&status=action_required" --jq '.workflow_runs[].id')"
            if [[ "$(wc -w <<< "$runs")" -ge 2 ]]; then break; fi
          done
          if [[ -z "$runs" ]]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
            exit 0
          fi
          for id in $runs; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
          done
