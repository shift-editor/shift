name: Release Shift Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-desktop
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve Nightly publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.publication.outputs.should_publish }}
      upload_r2: ${{ steps.publication.outputs.upload_r2 }}
      version: ${{ steps.publication.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check Nightly publication state
        id: publication
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          : "${R2_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          : "${R2_BUCKET:?R2_RELEASE_BUCKET is required}"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          MANIFEST="nightly/${GITHUB_SHA}/manifest.json"

          if aws s3api head-object \
            --endpoint-url "$ENDPOINT" \
            --bucket "$R2_BUCKET" \
            --key "$MANIFEST" >/dev/null 2>&1; then
            upload_r2=false
            aws s3 cp "s3://${R2_BUCKET}/${MANIFEST}" archived-manifest.json \
              --endpoint-url "$ENDPOINT" \
              --no-progress \
              --only-show-errors
            version="$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' archived-manifest.json)"
          else
            aws s3api list-objects-v2 \
              --endpoint-url "$ENDPOINT" \
              --bucket "$R2_BUCKET" \
              --max-keys 1 >/dev/null
            upload_r2=true
            version="0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi

          active=false
          if git ls-remote --exit-code --heads origin update-feeds >/dev/null 2>&1; then
            git fetch origin update-feeds
            if git show FETCH_HEAD:updates/nightly/darwin/arm64/latest-mac.yml 2>/dev/null \
              | grep -Fq "/nightly/${GITHUB_SHA}/"; then
              active=true
            fi
          fi

          if [[ "$upload_r2" == "false" ]]; then
            if [[ "$active" == "true" ]]; then
              echo "Nightly ${GITHUB_SHA} is already active"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "R2 contains ${GITHUB_SHA}, but the Nightly feed does not reference it." >&2
              echo "Rerun the failed feed job from the original workflow run." >&2
              exit 1
            fi
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "upload_r2=$upload_r2" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-26
            platform: darwin
            arch: arm64
            builder-args: "--mac zip dmg --arm64"
          - name: macOS x64
            runner: macos-26-intel
            platform: darwin
            arch: x64
            builder-args: "--mac zip dmg --x64"
          - name: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
            builder-args: "--win nsis --x64"
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            builder-args: "--linux deb rpm --x64"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Linux maker tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm xvfb

      - name: Import Developer ID certificate
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/shift-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          export CERTIFICATE_PATH
          python3 -c 'import base64, os; open(os.environ["CERTIFICATE_PATH"], "wb").write(base64.b64decode(os.environ["APPLE_CERTIFICATE"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Set shared Nightly version
        run: node scripts/product-version.mjs set "${{ needs.prepare.outputs.version }}"

      - name: Build native bridge
        run: pnpm build:native

      - name: Build desktop application
        env:
          SHIFT_DISTRIBUTION: nightly
        run: pnpm --filter @shift/desktop build

      - name: Make desktop distributables
        env:
          SHIFT_DISTRIBUTION: nightly
          SHIFT_BUILD_ARCH: ${{ matrix.arch }}
          SIGN_MACOS: ${{ matrix.platform == 'darwin' && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @shift/desktop exec electron-builder --config electron-builder.config.ts ${{ matrix.builder-args }} --publish never

      - name: Resolve packaged application
        id: package
        shell: bash
        env:
          OUTPUT_ROOT: apps/desktop/out/${{ matrix.platform }}-${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            darwin)
              APP_PATH="$(find "$OUTPUT_ROOT" -maxdepth 3 -type d -name 'Shift Nightly.app' -print -quit)"
              test -n "$APP_PATH"
              PACKAGE_PATH="$(dirname "$APP_PATH")"
              echo "app=$APP_PATH" >> "$GITHUB_OUTPUT"
              ;;
            win32)
              EXECUTABLE_PATH="$(find "$OUTPUT_ROOT" -type f -name 'shift-nightly.exe' -print -quit)"
              test -n "$EXECUTABLE_PATH"
              PACKAGE_PATH="$(dirname "$EXECUTABLE_PATH")"
              ;;
            linux)
              EXECUTABLE_PATH="$(find "$OUTPUT_ROOT" -type f -name 'shift-nightly' -print -quit)"
              test -n "$EXECUTABLE_PATH"
              PACKAGE_PATH="$(dirname "$EXECUTABLE_PATH")"
              sudo chown root:root "$PACKAGE_PATH/chrome-sandbox"
              sudo chmod 4755 "$PACKAGE_PATH/chrome-sandbox"
              ;;
          esac
          test -d "$PACKAGE_PATH"
          echo "path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"

      - name: Smoke-test packaged application
        run: node scripts/smoke-packaged.mjs "${{ steps.package.outputs.path }}" nightly

      - name: Verify macOS signature
        if: matrix.platform == 'darwin'
        run: |
          codesign --verify --deep --strict --verbose=2 "${{ steps.package.outputs.app }}"
          xcrun stapler validate "${{ steps.package.outputs.app }}"

      - name: Upload Nightly artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Shift-Nightly-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/out/${{ matrix.platform }}-${{ matrix.arch }}/*.zip
            apps/desktop/out/${{ matrix.platform }}-${{ matrix.arch }}/*.dmg
            apps/desktop/out/${{ matrix.platform }}-${{ matrix.arch }}/*.exe
            apps/desktop/out/${{ matrix.platform }}-${{ matrix.arch }}/*.blockmap
            apps/desktop/out/${{ matrix.platform }}-${{ matrix.arch }}/*.deb
            apps/desktop/out/${{ matrix.platform }}-${{ matrix.arch }}/*.rpm
            apps/desktop/out/${{ matrix.platform }}-${{ matrix.arch }}/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish rolling Nightly assets
    needs:
      - prepare
      - build
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-update-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          pattern: Shift-Nightly-*
          path: dist

      - name: Prepare Nightly assets
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/prepare-nightly-release.mjs dist public updates "$NIGHTLY_VERSION"

      - name: Write immutable Nightly manifest
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          (
            cd updates
            sha256sum * | jq -Rn \
              '[inputs | capture("^(?<sha256>[0-9a-f]+)  (?<name>.+)$")]'
          ) > assets.json
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg version "$NIGHTLY_VERSION" \
            --slurpfile assets assets.json \
            '{commit: $commit, version: $version, publishedAt: $publishedAt, assets: $assets[0]}' \
            > manifest.json
          rm assets.json

      - name: Archive immutable updater assets in R2
        if: needs.prepare.outputs.upload_r2 == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          DESTINATION="s3://${R2_BUCKET}/nightly/${GITHUB_SHA}/"
          aws s3 cp updates "$DESTINATION" \
            --recursive \
            --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress \
            --only-show-errors
          aws s3 cp manifest.json "${DESTINATION}manifest.json" \
            --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress \
            --only-show-errors

      - name: Verify public R2 assets
        shell: bash
        env:
          R2_BASE_URL: ${{ vars.R2_RELEASE_BASE_URL }}
        run: |
          set -euo pipefail
          : "${R2_BASE_URL:?R2_RELEASE_BASE_URL is required}"
          [[ "$R2_BASE_URL" == https://* ]] || {
            echo "R2_RELEASE_BASE_URL must use HTTPS" >&2
            exit 1
          }
          BUILD_URL="${R2_BASE_URL%/}/nightly/${GITHUB_SHA}"
          jq -r '.assets[].name' manifest.json | while IFS= read -r asset; do
            curl --fail --head --retry 5 --retry-all-errors \
              "${BUILD_URL}/${asset}" >/dev/null
          done
          curl --fail --head --retry 5 --retry-all-errors \
            "${BUILD_URL}/manifest.json" >/dev/null

      - name: Write Nightly release notes
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:8}"
          cat > nightly-notes.md <<EOF
          > [!WARNING]
          > **Experimental Nightly:** Work on copies and keep independent backups. This build may contain bugs, crashes, data loss, or security vulnerabilities.

          Built from [\`$SHORT_SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) after every platform completed packaging and its packaged-app smoke test. macOS builds are signed and notarized; Windows and Linux builds are currently unsigned. See the [code signing policy](https://github.com/shift-editor/shift/blob/main/CODE_SIGNING_POLICY.md).

          This rolling prerelease is replaced only by a later complete Nightly build.
          EOF

      - name: Publish rolling Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly public/* --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
            gh release edit nightly \
              --title "Shift Nightly" \
              --notes-file nightly-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          else
            gh release create nightly public/* \
              --title "Shift Nightly" \
              --notes-file nightly-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

  feed:
    name: Publish Nightly update feed
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-update-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - uses: actions/download-artifact@v8
        with:
          pattern: Shift-Nightly-*
          path: dist

      - name: Require public Nightly assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view nightly --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "Nightly assets must be public before advancing update feeds" >&2
            exit 1
          fi

      - name: Prepare update-feeds branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin update-feeds >/dev/null 2>&1; then
            git fetch origin update-feeds
            git worktree add site FETCH_HEAD
          else
            git worktree add --detach site
            git -C site switch --orphan update-feeds
            git -C site rm -rf --ignore-unmatch .
          fi
          touch site/.nojekyll

      - name: Stage native Nightly feed
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
          R2_BASE_URL: ${{ vars.R2_RELEASE_BASE_URL }}
        run: |
          set -euo pipefail
          export NIGHTLY_ASSET_BASE_URL="${R2_BASE_URL%/}/nightly/${GITHUB_SHA}"
          node scripts/prepare-update-feed.mjs dist site nightly "$NIGHTLY_VERSION"

      - name: Deploy update feeds
        shell: bash
        run: |
          set -euo pipefail
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site add .
          git -C site commit -m "Publish Shift Nightly ${{ needs.prepare.outputs.version }} update feed"
          git -C site push origin HEAD:update-feeds

  prune:
    name: Prune retired Nightly assets
    needs:
      - prepare
      - feed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          pattern: Shift-Nightly-*
          path: dist

      - name: Prepare authoritative GitHub asset set
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/prepare-nightly-release.mjs dist public updates "$NIGHTLY_VERSION"

      - name: Delete retired GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          find public -maxdepth 1 -type f -printf '%f\n' | sort > active-assets.txt
          gh release view nightly --json assets \
            --jq '.assets[].name | select(. == "SHA256SUMS" or startswith("Shift-Nightly-"))' \
            | sort > published-assets.txt
          comm -23 published-assets.txt active-assets.txt > retired-assets.txt

          if [[ ! -s retired-assets.txt ]]; then
            echo "No retired GitHub Nightly assets"
          else
            while IFS= read -r asset; do
              echo "Deleting GitHub asset $asset"
              gh release delete-asset nightly "$asset" --yes
            done < retired-assets.txt
          fi

      - name: Delete retired R2 Nightlies older than 14 days
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-objects-v2 \
            --endpoint-url "$ENDPOINT" \
            --bucket "$R2_BUCKET" \
            --prefix nightly/ \
            --output json > r2-objects.json
          node scripts/find-retired-nightly-objects.mjs \
            r2-objects.json "$GITHUB_SHA" 14 > retired-r2-objects.txt

          if [[ ! -s retired-r2-objects.txt ]]; then
            echo "No retired R2 Nightlies"
          else
            while IFS= read -r key; do
              echo "Deleting R2 object $key"
              aws s3api delete-object \
                --endpoint-url "$ENDPOINT" \
                --bucket "$R2_BUCKET" \
                --key "$key"
            done < retired-r2-objects.txt
          fi
