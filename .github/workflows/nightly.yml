name: Nightly Desktop

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-desktop
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve Nightly version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        run: |
          VERSION="0.1.0-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate update signing key
        env:
          SHIFT_UPDATE_PRIVATE_KEY: ${{ secrets.SHIFT_UPDATE_PRIVATE_KEY }}
          SHIFT_UPDATE_PUBLIC_KEY: ${{ vars.SHIFT_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SHIFT_UPDATE_PRIVATE_KEY" || -z "$SHIFT_UPDATE_PUBLIC_KEY" ]]; then
            echo "The update signing key and public key must both be configured" >&2
            exit 1
          fi
          DERIVED_PUBLIC_KEY="$(printf '%s' "$SHIFT_UPDATE_PRIVATE_KEY" | base64 --decode | openssl pkey -inform DER -pubout -outform DER | base64 -w0)"
          if [[ "$DERIVED_PUBLIC_KEY" != "$SHIFT_UPDATE_PUBLIC_KEY" ]]; then
            echo "The update signing key does not match SHIFT_UPDATE_PUBLIC_KEY" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            targets: zip
            package-dir: Shift Nightly-darwin-arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
            targets: zip
            package-dir: Shift Nightly-darwin-x64
          - name: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
            targets: squirrel
            package-dir: Shift Nightly-win32-x64
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            targets: "deb,rpm"
            package-dir: Shift Nightly-linux-x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Linux maker tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm xvfb

      - name: Import Developer ID certificate
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/shift-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          export CERTIFICATE_PATH
          python3 -c 'import base64, os; open(os.environ["CERTIFICATE_PATH"], "wb").write(base64.b64decode(os.environ["APPLE_CERTIFICATE"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Set nightly version
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/product-version.mjs set "$NIGHTLY_VERSION"

      - name: Build native bridge
        run: pnpm build:native

      - name: Make desktop distributables
        env:
          SHIFT_DISTRIBUTION: nightly
          SHIFT_UPDATE_PUBLIC_KEY: ${{ vars.SHIFT_UPDATE_PUBLIC_KEY }}
          SHIFT_WINDOWS_UPDATES_ENABLED: ${{ vars.SHIFT_WINDOWS_UPDATES_ENABLED || '0' }}
          SIGN_MACOS: ${{ matrix.platform == 'darwin' && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @shift/desktop exec electron-forge make --arch ${{ matrix.arch }} --targets "${{ matrix.targets }}"

      - name: Prepare packaged application for smoke test
        id: smoke-package
        shell: bash
        env:
          PACKAGE_PATH: apps/desktop/out/${{ matrix.package-dir }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          if [[ "$PLATFORM" == "linux" ]]; then
            SMOKE_PACKAGE_PATH="apps/desktop/out/shift-nightly-linux-x64"
            mv "$PACKAGE_PATH" "$SMOKE_PACKAGE_PATH"
            PACKAGE_PATH="$SMOKE_PACKAGE_PATH"
            sudo chown root:root "$PACKAGE_PATH/chrome-sandbox"
            sudo chmod 4755 "$PACKAGE_PATH/chrome-sandbox"
          fi

          echo "path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"

      - name: Smoke-test packaged application
        run: node scripts/smoke-packaged.mjs "${{ steps.smoke-package.outputs.path }}" nightly

      - name: Verify macOS signature
        if: matrix.platform == 'darwin'
        run: |
          codesign --verify --deep --strict --verbose=2 "apps/desktop/out/${{ matrix.package-dir }}/Shift Nightly.app"
          xcrun stapler validate "apps/desktop/out/${{ matrix.package-dir }}/Shift Nightly.app"

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Shift-Nightly-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish rolling Nightly
    needs:
      - prepare
      - build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-update-feed
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install feed publication dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - uses: actions/download-artifact@v8
        with:
          pattern: Shift-Nightly-*
          path: dist
          merge-multiple: true

      - name: Prepare public assets
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/prepare-nightly-release.mjs dist public "$NIGHTLY_VERSION"

      - name: Protect Nightly history and channel from rollback
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
          SHIFT_UPDATE_PUBLIC_KEY: ${{ vars.SHIFT_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if ! NIGHTLY_REF="$(git ls-remote --refs --tags origin refs/tags/nightly)"; then
            echo "Could not inspect the remote Nightly tag" >&2
            exit 1
          fi
          if [[ -n "$NIGHTLY_REF" ]]; then
            NIGHTLY_SHA="${NIGHTLY_REF%%[[:space:]]*}"
            if ! git merge-base --is-ancestor "$NIGHTLY_SHA" "$GITHUB_SHA"; then
              echo "Refusing to publish stale commit $GITHUB_SHA behind Nightly $NIGHTLY_SHA" >&2
              exit 1
            fi
          fi
          scripts/check-update-feed-version.sh nightly "$NIGHTLY_VERSION"

      - name: Write Nightly release notes
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:8}"
          cat > nightly-notes.md <<EOF
          > [!WARNING]
          > **Experimental Nightly:** Work on copies and keep independent backups. This build may contain bugs, crashes, data loss, or security vulnerabilities.

          Built from [\`$SHORT_SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) after every platform completed packaging and its packaged-app smoke test. macOS builds are signed and notarized; Windows and Linux builds are currently unsigned.

          This rolling prerelease is replaced only by a later complete Nightly build.
          EOF

      - name: Publish rolling Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly public/* --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
            gh release edit nightly \
              --title "Shift Nightly" \
              --notes-file nightly-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          else
            gh release create nightly public/* \
              --title "Shift Nightly" \
              --notes-file nightly-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

      - name: Publish signed Nightly update feed
        env:
          SHIFT_UPDATE_PRIVATE_KEY: ${{ secrets.SHIFT_UPDATE_PRIVATE_KEY }}
          SHIFT_UPDATE_PUBLIC_KEY: ${{ vars.SHIFT_UPDATE_PUBLIC_KEY }}
          SHIFT_UPDATE_BASE_URL: https://shift-editor.github.io/shift/updates
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          scripts/publish-update-feed.sh \
            public \
            nightly \
            "$NIGHTLY_VERSION" \
            nightly \
            "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            "$RUNNER_TEMP/update-site"
