name: Release Labeled Nightly

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  dispatch:
    name: Dispatch Nightly after merge
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release: nightly')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Nightly workflow
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nightly.yml --ref main
