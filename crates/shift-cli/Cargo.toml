[package]
name = "shift-cli"
version = "0.1.0"
license.workspace = true
edition = "2024"
description = "Command-line tools for authoring, inspecting, and compiling Shift documents"
readme = "README.md"

[dependencies]
anstyle = "1"
clap = { version = "4.5.40", features = ["derive"] }
comfy-table = "7.2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
svgtypes = "0.16"
shift-backends = { workspace = true }
shift-font = { workspace = true }
shift-store = { workspace = true }
shift-workspace = { workspace = true }
tempfile = "3"
thiserror = "2"

[dev-dependencies]
shift-font = { workspace = true, features = ["test-support"] }
skrifa = "0.32.0"
rusqlite = "0.37.0"
