[package]
name = "shift-slug"
version = "0.1.0"
edition = "2021"
description = "GPU-independent Slug curve and band preprocessing for Shift glyph grids"
license = "MIT"

[lib]
crate-type = ["rlib"]

[features]
default = []
wgpu-benchmark = ["dep:naga", "dep:pollster", "dep:wgpu"]

[dependencies]
shift-font = { workspace = true }
shift-glyph-codec = { workspace = true }

naga = { version = "30.0.0", optional = true, features = ["wgsl-in"] }
pollster = { version = "0.4", optional = true }
wgpu = { version = "30.0.0", optional = true, default-features = false, features = [
    "dx12",
    "metal",
    "parking_lot",
    "std",
    "vulkan",
    "wgsl",
] }

[dev-dependencies]
shift-backends = { workspace = true }
shift-font = { workspace = true, features = ["test-support"] }
shift-wire = { workspace = true }
skrifa = "0.32.0"

[[example]]
name = "benchmark_wgpu"
required-features = ["wgpu-benchmark"]

[[example]]
name = "benchmark_variable_wgpu"
required-features = ["wgpu-benchmark"]
