[package]
name = "pack-derive"
version = "0.0.0"
edition = "2024"
description = "#[derive(Pack)] and #[pack::interface]: the Rust side of a packed value, and its TypeScript side as fragments"
license.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
