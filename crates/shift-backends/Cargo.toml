[package]
name = "shift-backends"
version = "0.1.0"
edition = "2021"
description = "Font format backends for reading and writing various font formats"
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
shift-font = { workspace = true }
shift-slug = { workspace = true }

norad = "0.18.4"
skrifa = "0.32.0"
fea-rs = "1.0"
fontbe = "1.0"
fontc = "1.0"
fontdrasil = "1.0"
fontir = "1.0"
glyphs-reader = "1.0"
kurbo = "0.13"
ordered-float = "5"
plist = "1"
quick-xml = { version = "0.37.5", features = ["serialize"] }
rayon = "1.10"
serde = "1"
tempfile = "3"
thiserror = "2.0.18"
write-fonts = "0.52"

[dev-dependencies]
harfrust = "0.13.3"
shift-font = { workspace = true, features = ["test-support"] }
shift-store = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
shift-store = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
