[package]
name = "shift-proof"
version = "0.1.0"
license.workspace = true
edition = "2024"
description = "Lays out and renders proof text and glyph grids from compiled font bytes, shaped by shift-text"

[dependencies]
png = "0.17.16"
serde = { version = "1.0", features = ["derive"] }
shift-text = { workspace = true, features = ["shape"] }
skrifa = "0.32.0"
thiserror = "2"
tiny-skia = "0.11.4"

[lints]
workspace = true
