[package]
name = "shift-proof"
version = "0.1.0"
license.workspace = true
edition = "2024"
description = "Shapes, lays out, and renders proof text and glyph grids from compiled font bytes"

[dependencies]
harfrust = "0.13.3"
png = "0.17.16"
serde = { version = "1.0", features = ["derive"] }
skrifa = "0.32.0"
thiserror = "2"
tiny-skia = "0.11.4"
unicode-bidi = "0.3.18"
unicode-script = "0.5"

[lints]
workspace = true
