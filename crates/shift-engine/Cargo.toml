[package]
name = "shift-engine"
version = "0.1.0"
license.workspace = true
edition = "2024"
description = "Shift's editing session over a partly loaded font, shared by the native workspace and the renderer."

[dependencies]
# The `StoreReader` request protocol, for an engine that runs apart from its store.
pack = { workspace = true }
shift-font = { workspace = true, features = ["pack"] }
# The text options a run keeps (alignment, feature settings): their types only.
shift-text = { workspace = true, features = ["pack", "serde"] }
# The auto layout a frame and each node keep (direction, gap, sizing,
# placement): their types only, without Taffy.
shift-layout = { workspace = true, features = ["pack", "serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
rmp-serde = "1.3"
proptest = "1"
shift-font = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
