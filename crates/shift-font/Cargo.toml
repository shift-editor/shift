[package]
name = "shift-font"
version = "0.1.0"
edition = "2024"
description = "Live Rust font authoring model and editing behavior"
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
test-support = []
# ToSql/FromSql for ids, for crates that store them in SQLite.
rusqlite = ["dep:rusqlite"]

[dependencies]
bitflags = "2"
rusqlite = { version = "0.37.0", optional = true }
fontdrasil = "1.0.0"
indexmap = { version = "2", features = ["serde"] }
kurbo = "0.13.0"
svgtypes = "0.16"
# Trigonometry with identical bits natively and in WebAssembly.
libm = "0.2.16"
# Persistent maps, so a font copy shares its index instead of copying it.
imbl = { version = "7", features = ["serde"] }
linesweeper = "0.3.0"
serde = { version = "1.0", features = ["derive", "rc"] }
thiserror = "2.0.18"
getrandom = "0.3.3"
icu_properties = "2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.3", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
