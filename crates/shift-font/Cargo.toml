[package]
name = "shift-font"
version = "0.1.0"
edition = "2021"
description = "Live Rust font authoring model and editing behavior"
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
test-support = []

[dependencies]
bitflags = "2"
fontdrasil = "1.0.0"
indexmap = { version = "2", features = ["serde"] }
kurbo = "0.13.0"
linesweeper = "0.3.0"
serde = { version = "1.0", features = ["derive", "rc"] }
thiserror = "2.0.18"
getrandom = "0.3.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.3", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1.0"
