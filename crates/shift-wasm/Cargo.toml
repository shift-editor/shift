[package]
name = "shift-wasm"
version = "0.0.0"
edition = "2024"
description = "Shift's shared Rust rules for the editor, compiled to WebAssembly"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The editing engine (shift-engine over shift-font), with the text shaping
# its reads answer (shift-shape and HarfRust) and the shaper-font compile it
# shapes with (shift-shaper-font: fea-rs and fontbe), built into
# @shift/wasm/engine, a separate module the editor loads when a font opens
# for editing.
engine = [
    "dep:rmp-serde",
    "dep:serde-wasm-bindgen",
    "dep:shift-shape",
    "dep:shift-shaper-font",
    "engine-protocol",
    "shift-layout/layout",
]
# The engine's interfaces and the records they carry, without the session
# that answers them: what the editor's generated side is written from. Kept
# out of the default build, which would otherwise link shift-wire, and with
# it napi's symbols wherever another crate turns napi on.
engine-protocol = ["dep:shift-layout", "dep:shift-wire"]

[dependencies]
fontir = "1.0.0"
serde = { version = "1.0", features = ["derive"] }
pack = { workspace = true }
shift-font = { workspace = true, features = ["pack"] }
# Text layout (the `layout` feature, with the engine); its request and
# result types alone for the protocol.
shift-layout = { workspace = true, default-features = false, features = ["pack"], optional = true }
shift-shape = { workspace = true, optional = true }
shift-shaper-font = { workspace = true, optional = true }
# Typed arrays and the blob lists a request carries (`blobs`).
js-sys = "0.3"
rmp-serde = { version = "1.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
# The scene a session without an engine edits (`scene`), and the engine itself.
shift-engine = { workspace = true }
# The records an engine edit changes, in the native workspace's packed shape.
shift-wire = { workspace = true, features = ["pack"], optional = true }
thiserror = "2"
# Must match the wasm-bindgen CLI in the Nix dev shell exactly; scripts check it.
wasm-bindgen = "=0.2.121"

[dev-dependencies]
shift-font = { workspace = true, features = ["test-support"] }
# The compile counter the shaping tests read.
shift-shaper-font = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
