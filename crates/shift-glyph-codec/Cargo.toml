[package]
name = "shift-glyph-codec"
version = "0.1.0"
edition = "2021"
description = "Strict packed glyph payload codecs shared by Shift transports and stores"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
