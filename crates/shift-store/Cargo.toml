[package]
name = "shift-store"
version = "0.1.0"
edition = "2024"

[dependencies]
shift-font = { workspace = true }
blake3 = "1.8"
getrandom = "0.3"
rusqlite = { version = "0.37.0", features = ["blob", "backup", "limits"] }
rayon = "1.10"
rmp-serde = "1.3"
serde = "1.0"
serde_json = "1.0"
thiserror = "2"
tempfile = "3"
zstd = "0.13"

[dev-dependencies]
shift-font = { workspace = true, features = ["test-support"] }
