[package]
name = "shift-source"
version = "0.1.0"
edition = "2021"
description = "Experimental Shift-native source package format"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
shift-ir = { workspace = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3"
